server.port=5454

# Use H2 in-memory database for local development
spring.datasource.url=jdbc:h2:mem:twitter;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ORM settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.springframework=DEBUG
logging.level.com.zosh=DEBUG

# Disable datasource initialization scripts to avoid errors during dev
spring.sql.init.mode=never

# Razorpay placeholders (no-op for local dev)
razorpay.api.key=
razorpay.api.secret=
